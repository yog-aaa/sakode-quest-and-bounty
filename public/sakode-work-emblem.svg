<svg width="1100" height="1060" viewBox="0 0 1100 1060" fill="none" xmlns="http://www.w3.org/2000/svg">
  <title>SAKODE Work Quest Emblem</title>
  <desc>Master vector bounty quest emblem featuring official SAKODE developer mascot, golden bounty coins, and 3D WORK ribbon</desc>
  
  <defs>
    <radialGradient id="hex-ambient" cx="50%" cy="45%" r="55%">
      <stop offset="0%" stop-color="#1E293B" />
      <stop offset="70%" stop-color="#0F172A" />
      <stop offset="100%" stop-color="#0B0F19" />
    </radialGradient>
    <linearGradient id="neon-cyan-stroke" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#71CFFE" />
      <stop offset="50%" stop-color="#00A3E0" />
      <stop offset="100%" stop-color="#0284C7" />
    </linearGradient>
  </defs>

  <!-- LAYER 1: DROP SHADOW -->
  <path d="M 566 59 L 931 269 A 55 55 0 0 1 956 314 L 956 704 A 55 55 0 0 1 931 749 L 566 959 A 55 55 0 0 1 541 959 L 176 749 A 55 55 0 0 1 151 704 L 151 314 A 55 55 0 0 1 176 269 L 541 59 A 55 55 0 0 1 566 59 Z" fill="black" />

  <!-- LAYER 2: WHITE DIE-CUT BORDER -->
  <path d="M 550 35 L 915 245 A 55 55 0 0 1 940 290 L 940 680 A 55 55 0 0 1 915 725 L 550 935 A 55 55 0 0 1 525 935 L 160 725 A 55 55 0 0 1 135 680 L 135 290 A 55 55 0 0 1 160 245 L 525 35 A 55 55 0 0 1 550 35 Z" fill="white" />

  <!-- LAYER 3: INNER SHIELD BODY -->
  <path d="M 550 60 L 890 256 A 40 40 0 0 1 910 290 L 910 680 A 40 40 0 0 1 890 714 L 550 910 A 40 40 0 0 1 530 910 L 190 714 A 40 40 0 0 1 170 680 L 170 290 A 40 40 0 0 1 190 256 L 530 60 A 40 40 0 0 1 550 60 Z" fill="url(#hex-ambient)" stroke="url(#neon-cyan-stroke)" stroke-width="16" />

  <!-- Ambient Light Radar Ring -->
  <circle cx="550" cy="480" r="320" fill="none" stroke="#71CFFE" stroke-width="3" stroke-opacity="0.25" stroke-dasharray="10 10" />

  <!-- SAKODE Master Header Text -->
  <text x="550" y="215" fill="#71CFFE" font-family="Nunito, sans-serif" font-weight="900" font-size="46" letter-spacing="4" text-anchor="middle">SAKODE</text>

