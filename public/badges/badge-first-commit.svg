<svg width="128" height="128" viewBox="0 0 128 128" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <!-- Background Radial Gradient -->
    <radialGradient id="bg-first-commit" cx="50%" cy="38%" r="65%">
      <stop offset="0%" stop-color="#1A2536" />
      <stop offset="65%" stop-color="#0E1624" />
      <stop offset="100%" stop-color="#070C14" />
    </radialGradient>

    <!-- Outer Rim Linear Gradient -->
    <linearGradient id="rim-first-commit" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#BAE6FD" />
      <stop offset="50%" stop-color="#71CFFE" />
      <stop offset="100%" stop-color="#71CFFE" stop-opacity="0.7" />
    </linearGradient>

    <!-- Subtle Drop Shadow -->
    <filter id="shadow-first-commit" x="-10%" y="-10%" width="120%" height="125%">
      <feDropShadow dx="0" dy="4" stdDeviation="4" flood-color="#000000" flood-opacity="0.5" />
    </filter>
  </defs>

  <!-- LAYER 1: BASE MEDALLION (SQUIRCLE WITH DOUBLE BORDER) -->
  <g filter="url(#shadow-first-commit)">
    <rect x="10" y="8" width="108" height="108" rx="28" fill="url(#bg-first-commit)" stroke="url(#rim-first-commit)" stroke-width="2.5" />
    <rect x="15" y="13" width="98" height="98" rx="23" fill="none" stroke="white" stroke-opacity="0.1" stroke-width="1.2" />
  </g>

  <!-- Ambient Radar Arc -->
  <path d="M 32 30 A 48 48 0 0 1 96 30" stroke="#71CFFE" stroke-opacity="0.18" stroke-width="1.5" stroke-dasharray="3 3" />



  <!-- LAYER 2: ICONOGRAPHY -->
  <g id="icon-first-commit">
    <!-- Git Branch Node & First Commit Marker -->
    <g transform="translate(64, 58)">
      <line x1="-12" y1="-20" x2="-12" y2="20" stroke="#71CFFE" stroke-width="3" stroke-linecap="round" />
      <path d="M -12 0 C 4 0, 14 -10, 14 -18" stroke="#38BDF8" stroke-width="3" fill="none" stroke-linecap="round" />
      <!-- Commit Nodes -->
      <circle cx="-12" cy="-18" r="5" fill="#BAE6FD" stroke="#0369A1" stroke-width="2" />
      <circle cx="-12" cy="14" r="5" fill="#71CFFE" stroke="#0369A1" stroke-width="2" />
      <circle cx="14" cy="-18" r="6" fill="#EDAC1C" stroke="#78350F" stroke-width="2" />
      <polygon points="14,-22 17,-18 14,-14 11,-18" fill="white" />
    </g>
  </g>

  <!-- LAYER 3: SAKODE SIGNATURE GOLD SMILE ARC -->
  <g id="smile-first-commit">
    <path d="M 48 102 C 54 107.5 74 107.5 80 102" stroke="#EDAC1C" stroke-width="2.8" stroke-linecap="round" />
    <circle cx="48" cy="102" r="1.2" fill="#EDAC1C" />
    <circle cx="80" cy="102" r="1.2" fill="#EDAC1C" />
  </g>
</svg>