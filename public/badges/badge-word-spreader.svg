<svg width="128" height="128" viewBox="0 0 128 128" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <!-- Background Radial Gradient -->
    <radialGradient id="bg-word-spreader" cx="50%" cy="38%" r="65%">
      <stop offset="0%" stop-color="#1A2536" />
      <stop offset="65%" stop-color="#0E1624" />
      <stop offset="100%" stop-color="#070C14" />
    </radialGradient>

    <!-- Outer Rim Linear Gradient -->
    <linearGradient id="rim-word-spreader" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FEF08A" />
      <stop offset="50%" stop-color="#EDAC1C" />
      <stop offset="100%" stop-color="#EDAC1C" stop-opacity="0.7" />
    </linearGradient>

    <!-- Subtle Drop Shadow -->
    <filter id="shadow-word-spreader" x="-10%" y="-10%" width="120%" height="125%">
      <feDropShadow dx="0" dy="4" stdDeviation="4" flood-color="#000000" flood-opacity="0.5" />
    </filter>
  </defs>

  <!-- LAYER 1: BASE MEDALLION (SQUIRCLE WITH DOUBLE BORDER) -->
  <g filter="url(#shadow-word-spreader)">
    <rect x="10" y="8" width="108" height="108" rx="28" fill="url(#bg-word-spreader)" stroke="url(#rim-word-spreader)" stroke-width="2.5" />
    <rect x="15" y="13" width="98" height="98" rx="23" fill="none" stroke="white" stroke-opacity="0.1" stroke-width="1.2" />
  </g>

  <!-- Ambient Radar Arc -->
  <path d="M 32 30 A 48 48 0 0 1 96 30" stroke="#EDAC1C" stroke-opacity="0.18" stroke-width="1.5" stroke-dasharray="3 3" />



  <!-- LAYER 2: ICONOGRAPHY -->
  <g id="icon-word-spreader">
    <!-- Megaphone Broadcast Waves -->
    <g transform="translate(64, 58)">
      <!-- Megaphone Horn -->
      <polygon points="-16,-4 -4,-4 8,-14 8,14 -4,4 -16,4" fill="#EDAC1C" stroke="#FEF08A" stroke-width="1.5" />
      <rect x="-18" y="-4" width="4" height="8" rx="2" fill="#B45309" />
      <!-- Sound Broadcast Waves -->
      <path d="M 14 -10 C 18 -6, 18 6, 14 10" stroke="#FEF08A" stroke-width="2.2" stroke-linecap="round" fill="none" />
      <path d="M 20 -15 C 26 -8, 26 8, 20 15" stroke="#EDAC1C" stroke-width="2.2" stroke-linecap="round" fill="none" />
    </g>
  </g>

  <!-- LAYER 3: SAKODE SIGNATURE GOLD SMILE ARC -->
  <g id="smile-word-spreader">
    <path d="M 48 102 C 54 107.5 74 107.5 80 102" stroke="#EDAC1C" stroke-width="2.8" stroke-linecap="round" />
    <circle cx="48" cy="102" r="1.2" fill="#EDAC1C" />
    <circle cx="80" cy="102" r="1.2" fill="#EDAC1C" />
  </g>
</svg>