<svg width="128" height="128" viewBox="0 0 128 128" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <!-- Background Radial Gradient -->
    <radialGradient id="bg-titan-of-code" cx="50%" cy="38%" r="65%">
      <stop offset="0%" stop-color="#1A2536" />
      <stop offset="65%" stop-color="#0E1624" />
      <stop offset="100%" stop-color="#070C14" />
    </radialGradient>

    <!-- Outer Rim Linear Gradient -->
    <linearGradient id="rim-titan-of-code" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FEF08A" />
      <stop offset="50%" stop-color="#EDAC1C" />
      <stop offset="100%" stop-color="#EDAC1C" stop-opacity="0.7" />
    </linearGradient>

    <!-- Subtle Drop Shadow -->
    <filter id="shadow-titan-of-code" x="-10%" y="-10%" width="120%" height="125%">
      <feDropShadow dx="0" dy="4" stdDeviation="4" flood-color="#000000" flood-opacity="0.5" />
    </filter>
  </defs>

  <!-- LAYER 1: BASE MEDALLION (SQUIRCLE WITH DOUBLE BORDER) -->
  <g filter="url(#shadow-titan-of-code)">
    <rect x="10" y="8" width="108" height="108" rx="28" fill="url(#bg-titan-of-code)" stroke="url(#rim-titan-of-code)" stroke-width="2.5" />
    <rect x="15" y="13" width="98" height="98" rx="23" fill="none" stroke="white" stroke-opacity="0.1" stroke-width="1.2" />
  </g>

  <!-- Ambient Radar Arc -->
  <path d="M 32 30 A 48 48 0 0 1 96 30" stroke="#EDAC1C" stroke-opacity="0.18" stroke-width="1.5" stroke-dasharray="3 3" />



  <!-- LAYER 2: ICONOGRAPHY -->
  <g id="icon-titan-of-code">
    <!-- Giant Monolith Fortress with Golden Diamond Braces -->
    <g transform="translate(64, 58)">
      <!-- Monolith Pillar -->
      <rect x="-16" y="-22" width="32" height="44" rx="4" fill="#0F172A" stroke="#71CFFE" stroke-width="2.5" />
      <line x1="-10" y1="-14" x2="10" y2="-14" stroke="#38BDF8" stroke-width="2" stroke-linecap="round" />
      <line x1="-10" y1="-7" x2="4" y2="-7" stroke="#38BDF8" stroke-width="2" stroke-linecap="round" />
      <line x1="-10" y1="0" x2="8" y2="0" stroke="#38BDF8" stroke-width="2" stroke-linecap="round" />
      <!-- Golden Titan Crest -->
      <polygon points="0,-28 14,-22 0,-16 -14,-22" fill="#EDAC1C" stroke="#FEF08A" stroke-width="1.5" />
      <circle cx="0" cy="12" r="3" fill="#00A86B" />
    </g>
  </g>

  <!-- LAYER 3: SAKODE SIGNATURE GOLD SMILE ARC -->
  <g id="smile-titan-of-code">
    <path d="M 48 102 C 54 107.5 74 107.5 80 102" stroke="#EDAC1C" stroke-width="2.8" stroke-linecap="round" />
    <circle cx="48" cy="102" r="1.2" fill="#EDAC1C" />
    <circle cx="80" cy="102" r="1.2" fill="#EDAC1C" />
  </g>
</svg>