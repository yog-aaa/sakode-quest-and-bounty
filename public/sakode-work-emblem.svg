      <g transform="translate(-843, 0)">
        <path fill-rule="evenodd" clip-rule="evenodd" d="M2229.25 331.207C2223.83 371.162 2194.61 352.379 2188.14 376.481C2180.29 405.762 2198.34 482.271 2132.92 513.678C2097.6 530.637 2071.59 486.799 2102.45 464.439C2146.77 432.331 2113.53 409.783 2131.37 359.742C2138.96 338.435 2148.1 337.593 2136.96 319.544C2109.02 274.233 2133.46 195.415 2101.33 177.259C2096.44 174.494 2074.73 168.654 2073.3 145.43C2072.88 138.627 2083.15 95.6564 2135.39 129.668C2206.45 175.936 2160.61 280.732 2196.68 296.303C2205.48 300.099 2227.78 302.526 2229.25 331.207Z" fill="#383838"/>
      </g>
    </g>
    

  <!-- LAYER 5: BOUNTY COINS & STARS -->

    <!-- LEFT BOUNTY COIN -->
    <g id="coin-left">
      <!-- Coin Shadow -->
      <circle cx="271" cy="458" r="65" fill="black" opacity="0.6" />
      <!-- Outer Rim (Gold) -->
      <circle cx="265" cy="450" r="65" fill="#FFA800" stroke="#D97706" stroke-width="5" />
      <!-- Inner Face (Amber) -->
      <circle cx="265" cy="450" r="56" fill="#FBBF24" stroke="#F59E0B" stroke-width="2.5" />
      <!-- Embossed Code Brackets { } -->
      <text x="265" y="466" fill="#92400E" font-family="Nunito, sans-serif" font-weight="900" font-size="52" text-anchor="middle">&#123; &#125;</text>
    </g>

    <!-- RIGHT BOUNTY COIN -->
    <g id="coin-right">
      <!-- Coin Shadow -->
      <circle cx="841" cy="458" r="65" fill="black" opacity="0.6" />
      <!-- Outer Rim (Gold) -->
      <circle cx="835" cy="450" r="65" fill="#FFA800" stroke="#D97706" stroke-width="5" />
      <!-- Inner Face (Amber) -->
      <circle cx="835" cy="450" r="56" fill="#FBBF24" stroke="#F59E0B" stroke-width="2.5" />
      <!-- Embossed Code Brackets { } -->
      <text x="835" y="466" fill="#92400E" font-family="Nunito, sans-serif" font-weight="900" font-size="52" text-anchor="middle">&#123; &#125;</text>
    </g>
    

    <polygon points="210,284 217.28,302.72 236,310 217.28,317.28 210,336 202.72,317.28 184,310 202.72,302.72" fill="#FFA800" />
    <polygon points="890,284 897.28,302.72 916,310 897.28,317.28 890,336 882.72,317.28 864,310 882.72,302.72" fill="#FFA800" />
    <polygon points="360,160 365.6,174.4 380,180 365.6,185.6 360,200 354.4,185.6 340,180 354.4,174.4" fill="#71CFFE" />
    <polygon points="740,160 745.6,174.4 760,180 745.6,185.6 740,200 734.4,185.6 720,180 734.4,174.4" fill="#71CFFE" />
    

  <!-- LAYER 6: 3D RIBBON "WORK" -->

    <!-- 3D PLAQUE / RIBBON "WORK" -->
    <g id="work-plaque">
      <!-- Plaque Drop Shadow -->
      <rect x="250" y="719" width="620" height="145" rx="38" fill="black" />
      <!-- Plaque White Border -->
      <rect x="240" y="705" width="620" height="145" rx="38" fill="white" />
      <!-- Plaque Body: Cyber Cyan #71CFFE -->
      <rect x="248" y="713" width="604" height="129" rx="32" fill="#71CFFE" />
      <!-- Top Gloss -->
      <rect x="256" y="719" width="588" height="45" rx="20" fill="white" opacity="0.35" />
      <!-- Wordmark "WORK" -->
      <text x="550" y="801" fill="#0F172A" font-family="Nunito, sans-serif" font-weight="900" font-size="94" letter-spacing="3" text-anchor="middle">WORK</text>
      
      <!-- Sub-pill: "TASK & BOUNTY PLATFORM" -->
      <g transform="translate(370, 866)">
        <rect x="2" y="3" width="360" height="42" rx="21" fill="black" opacity="0.5" />
        <rect x="0" y="0" width="360" height="42" rx="21" fill="#FFA800" stroke="white" stroke-width="2.5" />
        <text x="180" y="27" fill="#0F172A" font-family="Nunito, sans-serif" font-weight="900" font-size="19" letter-spacing="1" text-anchor="middle">TASK &amp; BOUNTY PLATFORM</text>
      </g>
    </g>
    
</svg>