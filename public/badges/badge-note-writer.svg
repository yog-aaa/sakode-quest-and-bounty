<svg width="128" height="128" viewBox="0 0 128 128" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <!-- Background Radial Gradient -->
    <radialGradient id="bg-note-writer" cx="50%" cy="38%" r="65%">
      <stop offset="0%" stop-color="#1A2536" />
      <stop offset="65%" stop-color="#0E1624" />
      <stop offset="100%" stop-color="#070C14" />
    </radialGradient>

    <!-- Outer Rim Linear Gradient -->
    <linearGradient id="rim-note-writer" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#E9D5FF" />
      <stop offset="50%" stop-color="#BC71FE" />
      <stop offset="100%" stop-color="#BC71FE" stop-opacity="0.7" />
    </linearGradient>

    <!-- Subtle Drop Shadow -->
    <filter id="shadow-note-writer" x="-10%" y="-10%" width="120%" height="125%">
      <feDropShadow dx="0" dy="4" stdDeviation="4" flood-color="#000000" flood-opacity="0.5" />
    </filter>
  </defs>

  <!-- LAYER 1: BASE MEDALLION (SQUIRCLE WITH DOUBLE BORDER) -->
  <g filter="url(#shadow-note-writer)">
    <rect x="10" y="8" width="108" height="108" rx="28" fill="url(#bg-note-writer)" stroke="url(#rim-note-writer)" stroke-width="2.5" />
    <rect x="15" y="13" width="98" height="98" rx="23" fill="none" stroke="white" stroke-opacity="0.1" stroke-width="1.2" />
  </g>

  <!-- Ambient Radar Arc -->
  <path d="M 32 30 A 48 48 0 0 1 96 30" stroke="#BC71FE" stroke-opacity="0.18" stroke-width="1.5" stroke-dasharray="3 3" />



  <!-- LAYER 2: ICONOGRAPHY -->
  <g id="icon-note-writer">
    <!-- Open Manual / Cheatsheet with Fountain Pen -->
    <g transform="translate(64, 58)">
      <path d="M -22 -14 L -4 -16 L -4 16 L -22 14 Z" fill="#9333EA" stroke="#BC71FE" stroke-width="1.8" />
      <path d="M 22 -14 L 4 -16 L 4 16 L 22 14 Z" fill="#A855F7" stroke="#BC71FE" stroke-width="1.8" />
      <!-- Golden Quill Pen -->
      <path d="M 6 -24 L 18 -12 L 0 6 L -6 6 L -6 0 Z" fill="#EDAC1C" stroke="#FEF08A" stroke-width="1.2" />
      <circle cx="-5" cy="5" r="1.5" fill="#78350F" />
    </g>
  </g>

  <!-- LAYER 3: SAKODE SIGNATURE GOLD SMILE ARC -->
  <g id="smile-note-writer">
    <path d="M 48 102 C 54 107.5 74 107.5 80 102" stroke="#EDAC1C" stroke-width="2.8" stroke-linecap="round" />
    <circle cx="48" cy="102" r="1.2" fill="#EDAC1C" />
    <circle cx="80" cy="102" r="1.2" fill="#EDAC1C" />
  </g>
</svg>