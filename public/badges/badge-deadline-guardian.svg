<svg width="128" height="128" viewBox="0 0 128 128" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <!-- Background Radial Gradient -->
    <radialGradient id="bg-deadline-guardian" cx="50%" cy="38%" r="65%">
      <stop offset="0%" stop-color="#1A2536" />
      <stop offset="65%" stop-color="#0E1624" />
      <stop offset="100%" stop-color="#070C14" />
    </radialGradient>

    <!-- Outer Rim Linear Gradient -->
    <linearGradient id="rim-deadline-guardian" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FDBA74" />
      <stop offset="50%" stop-color="#F9723B" />
      <stop offset="100%" stop-color="#F9723B" stop-opacity="0.7" />
    </linearGradient>

    <!-- Subtle Drop Shadow -->
    <filter id="shadow-deadline-guardian" x="-10%" y="-10%" width="120%" height="125%">
      <feDropShadow dx="0" dy="4" stdDeviation="4" flood-color="#000000" flood-opacity="0.5" />
    </filter>
  </defs>

  <!-- LAYER 1: BASE MEDALLION (SQUIRCLE WITH DOUBLE BORDER) -->
  <g filter="url(#shadow-deadline-guardian)">
    <rect x="10" y="8" width="108" height="108" rx="28" fill="url(#bg-deadline-guardian)" stroke="url(#rim-deadline-guardian)" stroke-width="2.5" />
    <rect x="15" y="13" width="98" height="98" rx="23" fill="none" stroke="white" stroke-opacity="0.1" stroke-width="1.2" />
  </g>

  <!-- Ambient Radar Arc -->
  <path d="M 32 30 A 48 48 0 0 1 96 30" stroke="#F9723B" stroke-opacity="0.18" stroke-width="1.5" stroke-dasharray="3 3" />



  <!-- LAYER 2: ICONOGRAPHY -->
  <g id="icon-deadline-guardian">
    <!-- Stopwatch Clock surrounded by Protective Shield -->
    <g transform="translate(64, 58)">
      <!-- Clock Face -->
      <circle cx="0" cy="0" r="18" fill="#1E293B" stroke="#F9723B" stroke-width="2.5" />
      <!-- Clock Hands pointing to WIB on-time -->
      <line x1="0" y1="0" x2="0" y2="-10" stroke="#FDBA74" stroke-width="2.2" stroke-linecap="round" />
      <line x1="0" y1="0" x2="7" y2="4" stroke="#F9723B" stroke-width="2.2" stroke-linecap="round" />
      <circle cx="0" cy="0" r="3" fill="#EDAC1C" />
      <!-- Stopwatch Top Plunger -->
      <rect x="-3" y="-23" width="6" height="5" rx="1.5" fill="#F9723B" />
      <!-- Zero-Cron Safe Check -->
      <circle cx="16" cy="-12" r="4.5" fill="#00A86B" />
      <polyline points="14,-12 16,-10 19,-14" stroke="white" stroke-width="1.5" stroke-linecap="round" fill="none" />
    </g>
  </g>

  <!-- LAYER 3: SAKODE SIGNATURE GOLD SMILE ARC -->
  <g id="smile-deadline-guardian">
    <path d="M 48 102 C 54 107.5 74 107.5 80 102" stroke="#EDAC1C" stroke-width="2.8" stroke-linecap="round" />
    <circle cx="48" cy="102" r="1.2" fill="#EDAC1C" />
    <circle cx="80" cy="102" r="1.2" fill="#EDAC1C" />
  </g>
</svg>