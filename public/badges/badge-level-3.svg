<svg width="128" height="128" viewBox="0 0 128 128" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <!-- Background Radial Gradient -->
    <radialGradient id="bg-lvl3" cx="50%" cy="38%" r="65%">
      <stop offset="0%" stop-color="#1A2536" />
      <stop offset="65%" stop-color="#0E1624" />
      <stop offset="100%" stop-color="#070C14" />
    </radialGradient>

    <!-- Outer Rim Linear Gradient -->
    <linearGradient id="rim-lvl3" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#E9D5FF" />
      <stop offset="50%" stop-color="#BC71FE" />
      <stop offset="100%" stop-color="#BC71FE" stop-opacity="0.7" />
    </linearGradient>

    <!-- Subtle Drop Shadow -->
    <filter id="shadow-lvl3" x="-10%" y="-10%" width="120%" height="125%">
      <feDropShadow dx="0" dy="4" stdDeviation="4" flood-color="#000000" flood-opacity="0.5" />
    </filter>
  </defs>

  <!-- LAYER 1: BASE MEDALLION (SQUIRCLE WITH DOUBLE BORDER) -->
  <g filter="url(#shadow-lvl3)">
    <rect x="10" y="8" width="108" height="108" rx="28" fill="url(#bg-lvl3)" stroke="url(#rim-lvl3)" stroke-width="2.5" />
    <rect x="15" y="13" width="98" height="98" rx="23" fill="none" stroke="white" stroke-opacity="0.1" stroke-width="1.2" />
  </g>

  <!-- Ambient Radar Arc -->
  <path d="M 32 30 A 48 48 0 0 1 96 30" stroke="#BC71FE" stroke-opacity="0.18" stroke-width="1.5" stroke-dasharray="3 3" />

  <!-- Level Ribbon Tag -->
  <g transform="translate(64, 25)">
    <rect x="-24" y="-8" width="48" height="15" rx="7.5" fill="#BC71FE" />
    <text x="0" y="3" font-family="system-ui, -apple-system, sans-serif" font-size="9" font-weight="900" fill="#070C14" text-anchor="middle" letter-spacing="0.5">LVL 3</text>
  </g>

  <!-- LAYER 2: ICONOGRAPHY -->
  <g id="icon-lvl3">
    <!-- 3D Hexagonal Faceted Crystal Core -->
    <g transform="translate(64, 62)">
      <!-- Outer Orbit Ring -->
      <ellipse cx="0" cy="0" rx="27" ry="11" stroke="#BC71FE" stroke-opacity="0.4" stroke-width="1.5" transform="rotate(-20)" fill="none" />
      <circle cx="-24" cy="8" r="2.5" fill="#71CFFE" />
      <circle cx="24" cy="-8" r="2.5" fill="#EDAC1C" />
      
      <!-- Faceted Hex Crystal -->
      <polygon points="0,-20 17,-10 17,10 0,20 -17,10 -17,-10" fill="#7E22CE" stroke="#BC71FE" stroke-width="2" />
      <!-- Top Facet Table -->
      <polygon points="0,-20 17,-10 0,0 -17,-10" fill="#E9D5FF" />
      <!-- Left Facet -->
      <polygon points="-17,-10 0,0 0,20 -17,10" fill="#9333EA" />
      <!-- Right Facet -->
      <polygon points="17,-10 0,0 0,20 17,10" fill="#BC71FE" />
      <!-- Core Gleam -->
      <polygon points="0,-6 2,-1 7,0 2,1 0,6 -2,1 -7,0 -2,-1" fill="white" />
    </g>
  </g>

  <!-- LAYER 3: SAKODE SIGNATURE GOLD SMILE ARC -->
  <g id="smile-lvl3">
    <path d="M 48 102 C 54 107.5 74 107.5 80 102" stroke="#BC71FE" stroke-width="2.8" stroke-linecap="round" />
    <circle cx="48" cy="102" r="1.2" fill="#BC71FE" />
    <circle cx="80" cy="102" r="1.2" fill="#BC71FE" />
  </g>
</svg>