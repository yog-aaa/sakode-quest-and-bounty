<svg width="128" height="128" viewBox="0 0 128 128" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <!-- Background Radial Gradient -->
    <radialGradient id="bg-system-integrator" cx="50%" cy="38%" r="65%">
      <stop offset="0%" stop-color="#1A2536" />
      <stop offset="65%" stop-color="#0E1624" />
      <stop offset="100%" stop-color="#070C14" />
    </radialGradient>

    <!-- Outer Rim Linear Gradient -->
    <linearGradient id="rim-system-integrator" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#BAE6FD" />
      <stop offset="50%" stop-color="#71CFFE" />
      <stop offset="100%" stop-color="#71CFFE" stop-opacity="0.7" />
    </linearGradient>

    <!-- Subtle Drop Shadow -->
    <filter id="shadow-system-integrator" x="-10%" y="-10%" width="120%" height="125%">
      <feDropShadow dx="0" dy="4" stdDeviation="4" flood-color="#000000" flood-opacity="0.5" />
    </filter>
  </defs>

  <!-- LAYER 1: BASE MEDALLION (SQUIRCLE WITH DOUBLE BORDER) -->
  <g filter="url(#shadow-system-integrator)">
    <rect x="10" y="8" width="108" height="108" rx="28" fill="url(#bg-system-integrator)" stroke="url(#rim-system-integrator)" stroke-width="2.5" />
    <rect x="15" y="13" width="98" height="98" rx="23" fill="none" stroke="white" stroke-opacity="0.1" stroke-width="1.2" />
  </g>

  <!-- Ambient Radar Arc -->
  <path d="M 32 30 A 48 48 0 0 1 96 30" stroke="#71CFFE" stroke-opacity="0.18" stroke-width="1.5" stroke-dasharray="3 3" />



  <!-- LAYER 2: ICONOGRAPHY -->
  <g id="icon-system-integrator">
    <!-- Multi-Cloud Database & Microservices Nexus -->
    <g transform="translate(64, 58)">
      <!-- Central Hub Cylinder -->
      <ellipse cx="0" cy="-12" rx="14" ry="5" fill="#38BDF8" />
      <path d="M -14 -12 L -14 0 C -14 3, 0 5, 0 5 C 0 5, 14 3, 14 0 L 14 -12 Z" fill="#0284C7" />
      <path d="M -14 0 L -14 12 C -14 15, 0 17, 0 17 C 0 17, 14 15, 14 12 L 14 0 Z" fill="#0369A1" />
      <!-- Connected Bus Nodes -->
      <circle cx="-24" cy="-8" r="4" fill="#71CFFE" />
      <line x1="-20" y1="-8" x2="-14" y2="-8" stroke="#71CFFE" stroke-width="2" />
      <circle cx="24" cy="-8" r="4" fill="#BC71FE" />
      <line x1="20" y1="-8" x2="14" y2="-8" stroke="#BC71FE" stroke-width="2" />
      <circle cx="0" cy="24" r="3.5" fill="#EDAC1C" />
      <line x1="0" y1="17" x2="0" y2="21" stroke="#EDAC1C" stroke-width="2" />
    </g>
  </g>

  <!-- LAYER 3: SAKODE SIGNATURE GOLD SMILE ARC -->
  <g id="smile-system-integrator">
    <path d="M 48 102 C 54 107.5 74 107.5 80 102" stroke="#EDAC1C" stroke-width="2.8" stroke-linecap="round" />
    <circle cx="48" cy="102" r="1.2" fill="#EDAC1C" />
    <circle cx="80" cy="102" r="1.2" fill="#EDAC1C" />
  </g>
</svg>