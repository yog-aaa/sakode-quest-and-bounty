<svg width="128" height="128" viewBox="0 0 128 128" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <!-- Background Radial Gradient -->
    <radialGradient id="bg-honor-ambassador" cx="50%" cy="38%" r="65%">
      <stop offset="0%" stop-color="#1A2536" />
      <stop offset="65%" stop-color="#0E1624" />
      <stop offset="100%" stop-color="#070C14" />
    </radialGradient>

    <!-- Outer Rim Linear Gradient -->
    <linearGradient id="rim-honor-ambassador" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FEF08A" />
      <stop offset="50%" stop-color="#EDAC1C" />
      <stop offset="100%" stop-color="#EDAC1C" stop-opacity="0.7" />
    </linearGradient>

    <!-- Subtle Drop Shadow -->
    <filter id="shadow-honor-ambassador" x="-10%" y="-10%" width="120%" height="125%">
      <feDropShadow dx="0" dy="4" stdDeviation="4" flood-color="#000000" flood-opacity="0.5" />
    </filter>
  </defs>

  <!-- LAYER 1: BASE MEDALLION (SQUIRCLE WITH DOUBLE BORDER) -->
  <g filter="url(#shadow-honor-ambassador)">
    <rect x="10" y="8" width="108" height="108" rx="28" fill="url(#bg-honor-ambassador)" stroke="url(#rim-honor-ambassador)" stroke-width="2.5" />
    <rect x="15" y="13" width="98" height="98" rx="23" fill="none" stroke="white" stroke-opacity="0.1" stroke-width="1.2" />
  </g>

  <!-- Ambient Radar Arc -->
  <path d="M 32 30 A 48 48 0 0 1 96 30" stroke="#EDAC1C" stroke-opacity="0.18" stroke-width="1.5" stroke-dasharray="3 3" />



  <!-- LAYER 2: ICONOGRAPHY -->
  <g id="icon-honor-ambassador">
    <!-- Golden Diplomatic Ribbon & Grand Seal -->
    <g transform="translate(64, 58)">
      <!-- Twin Ribbon Tails -->
      <polygon points="-12,10 -18,26 -6,22 0,26" fill="#B45309" />
      <polygon points="12,10 18,26 6,22 0,26" fill="#92400E" />
      <!-- Medallion Center Seal -->
      <circle cx="0" cy="0" r="18" fill="#F59E0B" stroke="#FEF08A" stroke-width="2.5" />
      <polygon points="0,-12 4,-3 13,-2 6,5 8,14 0,9 -8,14 -6,5 -13,-2 -4,-3" fill="#FEF08A" />
      <circle cx="0" cy="2" r="2.5" fill="#78350F" />
    </g>
  </g>

  <!-- LAYER 3: SAKODE SIGNATURE GOLD SMILE ARC -->
  <g id="smile-honor-ambassador">
    <path d="M 48 102 C 54 107.5 74 107.5 80 102" stroke="#EDAC1C" stroke-width="2.8" stroke-linecap="round" />
    <circle cx="48" cy="102" r="1.2" fill="#EDAC1C" />
    <circle cx="80" cy="102" r="1.2" fill="#EDAC1C" />
  </g>
</svg>