<svg width="128" height="128" viewBox="0 0 128 128" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <!-- Background Radial Gradient -->
    <radialGradient id="bg-grand-evangelist" cx="50%" cy="38%" r="65%">
      <stop offset="0%" stop-color="#1A2536" />
      <stop offset="65%" stop-color="#0E1624" />
      <stop offset="100%" stop-color="#070C14" />
    </radialGradient>

    <!-- Outer Rim Linear Gradient -->
    <linearGradient id="rim-grand-evangelist" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FEF08A" />
      <stop offset="50%" stop-color="#EDAC1C" />
      <stop offset="100%" stop-color="#EDAC1C" stop-opacity="0.7" />
    </linearGradient>

    <!-- Subtle Drop Shadow -->
    <filter id="shadow-grand-evangelist" x="-10%" y="-10%" width="120%" height="125%">
      <feDropShadow dx="0" dy="4" stdDeviation="4" flood-color="#000000" flood-opacity="0.5" />
    </filter>
  </defs>

  <!-- LAYER 1: BASE MEDALLION (SQUIRCLE WITH DOUBLE BORDER) -->
  <g filter="url(#shadow-grand-evangelist)">
    <rect x="10" y="8" width="108" height="108" rx="28" fill="url(#bg-grand-evangelist)" stroke="url(#rim-grand-evangelist)" stroke-width="2.5" />
    <rect x="15" y="13" width="98" height="98" rx="23" fill="none" stroke="white" stroke-opacity="0.1" stroke-width="1.2" />
  </g>

  <!-- Ambient Radar Arc -->
  <path d="M 32 30 A 48 48 0 0 1 96 30" stroke="#EDAC1C" stroke-opacity="0.18" stroke-width="1.5" stroke-dasharray="3 3" />



  <!-- LAYER 2: ICONOGRAPHY -->
  <g id="icon-grand-evangelist">
    <!-- Triple Connected People Nodes & Globe Beacon -->
    <g transform="translate(64, 58)">
      <!-- Globe Arc -->
      <ellipse cx="0" cy="6" rx="26" ry="12" stroke="#EDAC1C" stroke-opacity="0.4" stroke-width="1.8" fill="none" />
      <!-- Center Leader -->
      <circle cx="0" cy="-12" r="6" fill="#FEF08A" stroke="#B45309" stroke-width="1.5" />
      <path d="M -9 4 C -9 -3, 9 -3, 9 4 Z" fill="#F59E0B" />
      <!-- Left Follower -->
      <circle cx="-18" cy="-4" r="4.5" fill="#EDAC1C" />
      <path d="M -24 9 C -24 4, -12 4, -12 9 Z" fill="#B45309" />
      <!-- Right Follower -->
      <circle cx="18" cy="-4" r="4.5" fill="#EDAC1C" />
      <path d="M 12 9 C 12 4, 24 4, 24 9 Z" fill="#B45309" />
    </g>
  </g>

  <!-- LAYER 3: SAKODE SIGNATURE GOLD SMILE ARC -->
  <g id="smile-grand-evangelist">
    <path d="M 48 102 C 54 107.5 74 107.5 80 102" stroke="#EDAC1C" stroke-width="2.8" stroke-linecap="round" />
    <circle cx="48" cy="102" r="1.2" fill="#EDAC1C" />
    <circle cx="80" cy="102" r="1.2" fill="#EDAC1C" />
  </g>
</svg>