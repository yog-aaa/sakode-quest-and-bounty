<svg width="128" height="128" viewBox="0 0 128 128" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <!-- Background Radial Gradient -->
    <radialGradient id="bg-lvl4" cx="50%" cy="38%" r="65%">
      <stop offset="0%" stop-color="#1A2536" />
      <stop offset="65%" stop-color="#0E1624" />
      <stop offset="100%" stop-color="#070C14" />
    </radialGradient>

    <!-- Outer Rim Linear Gradient -->
    <linearGradient id="rim-lvl4" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FEF08A" />
      <stop offset="50%" stop-color="#EDAC1C" />
      <stop offset="100%" stop-color="#EDAC1C" stop-opacity="0.7" />
    </linearGradient>

    <!-- Subtle Drop Shadow -->
    <filter id="shadow-lvl4" x="-10%" y="-10%" width="120%" height="125%">
      <feDropShadow dx="0" dy="4" stdDeviation="4" flood-color="#000000" flood-opacity="0.5" />
    </filter>
  </defs>

  <!-- LAYER 1: BASE MEDALLION (SQUIRCLE WITH DOUBLE BORDER) -->
  <g filter="url(#shadow-lvl4)">
    <rect x="10" y="8" width="108" height="108" rx="28" fill="url(#bg-lvl4)" stroke="url(#rim-lvl4)" stroke-width="2.5" />
    <rect x="15" y="13" width="98" height="98" rx="23" fill="none" stroke="white" stroke-opacity="0.1" stroke-width="1.2" />
  </g>

  <!-- Ambient Radar Arc -->
  <path d="M 32 30 A 48 48 0 0 1 96 30" stroke="#EDAC1C" stroke-opacity="0.18" stroke-width="1.5" stroke-dasharray="3 3" />

  <!-- Level Ribbon Tag -->
  <g transform="translate(64, 25)">
    <rect x="-24" y="-8" width="48" height="15" rx="7.5" fill="#EDAC1C" />
    <text x="0" y="3" font-family="system-ui, -apple-system, sans-serif" font-size="9" font-weight="900" fill="#070C14" text-anchor="middle" letter-spacing="0.5">LVL 4</text>
  </g>

  <!-- LAYER 2: ICONOGRAPHY -->
  <g id="icon-lvl4">
    <!-- Laurel Wreath & Fortress Shield Crown -->
    <g transform="translate(64, 61)">
      <!-- Left Laurel Branch -->
      <path d="M -8 18 C -22 14, -28 -2, -22 -14" stroke="#EDAC1C" stroke-width="2.2" stroke-linecap="round" fill="none" />
      <circle cx="-23" cy="-11" r="2.5" fill="#FEF08A" />
      <circle cx="-27" cy="-2" r="2.5" fill="#EDAC1C" />
      <circle cx="-23" cy="8" r="2.5" fill="#B45309" />

      <!-- Right Laurel Branch -->
      <path d="M 8 18 C 22 14, 28 -2, 22 -14" stroke="#EDAC1C" stroke-width="2.2" stroke-linecap="round" fill="none" />
      <circle cx="23" cy="-11" r="2.5" fill="#FEF08A" />
      <circle cx="27" cy="-2" r="2.5" fill="#EDAC1C" />
      <circle cx="23" cy="8" r="2.5" fill="#B45309" />

      <!-- Central Fortress Shield -->
      <path d="M -14 -12 L 0 -20 L 14 -12 L 14 5 C 14 14, 0 19, 0 19 C 0 19, -14 14, -14 5 Z" fill="#F59E0B" stroke="#FEF08A" stroke-width="1.8" />
      <!-- Shield Core Star -->
      <polygon points="0,-6 3,1 10,2 5,6 7,13 0,9 -7,13 -5,6 -10,2 -3,1" fill="#FEF08A" />
      <circle cx="0" cy="4" r="2" fill="#78350F" />
    </g>
  </g>

  <!-- LAYER 3: SAKODE SIGNATURE GOLD SMILE ARC -->
  <g id="smile-lvl4">
    <path d="M 48 102 C 54 107.5 74 107.5 80 102" stroke="#EDAC1C" stroke-width="2.8" stroke-linecap="round" />
    <circle cx="48" cy="102" r="1.2" fill="#EDAC1C" />
    <circle cx="80" cy="102" r="1.2" fill="#EDAC1C" />
  </g>
</svg>